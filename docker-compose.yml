services:
  postgres:
    image: postgres:17-alpine
    container_name: mastra-blueprint-postgres
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mastra_blueprint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mastra_blueprint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
